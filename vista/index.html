<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Difusión · MPBA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#193B57;--azul2:#155C8C;--acento:#29A8E0;--texto:#243645;--texto2:#647687;--fondo:#F5F7F9;--borde:#DCE4EB;--ok:#1C8053;--okFondo:#E2F3EA;--font:"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:17px/1.45 var(--font)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;border-bottom:4px solid var(--acento)}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
header img{height:30px}
header b{font-size:20px}

/* Dos modos, gigantes */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}
.modo{min-height:72px;border:2px solid var(--borde);background:#fff;border-radius:16px;cursor:pointer;font-size:20px;font-weight:700;color:var(--azul);display:flex;align-items:center;justify-content:center;gap:10px}
.modo svg{width:28px;height:28px}
.modo[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}

.buscar input{width:100%;height:60px;border:2px solid var(--borde);border-radius:14px;background:#fff;padding:0 18px;font-size:19px}
.buscar input:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(41,168,224,.3)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}

h2{font-size:15px;color:var(--texto2);font-weight:500;margin:20px 4px 10px}
.grupos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grupos{grid-template-columns:1fr}}
.grupo{min-height:64px;border:1px solid var(--borde);background:#fff;border-radius:14px;cursor:pointer;text-align:left;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--azul)}
.grupo span{font-weight:400;color:var(--texto2);font-size:15px;white-space:nowrap}
.grupo.dif{border:2px solid #E8963A;background:#FFF4E5;color:#7A4300}
.grupo.dif span{color:#9A5A12}
.etq{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 8px;margin-bottom:2px}
.etq.p{background:#E8963A;color:#fff}
.etq.c{background:#DCEBF6;color:var(--azul)}
.grupo .nom{display:block;font-weight:700;color:inherit;font-size:17px;white-space:normal}
h2.sec{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:22px 4px 10px}
h2.sec.p{color:#9A5A12}
h2.sec.c{color:var(--azul)}
.sub{font-size:14px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px;display:flex;justify-content:space-between}
.sub span{font-weight:400;color:var(--texto2);text-transform:none;letter-spacing:0}
.resumen{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.resumen button{min-height:40px;font-size:14px;background:#fff;border:1px solid var(--borde);border-radius:999px;padding:0 14px;color:var(--texto);cursor:pointer}
.resumen button:hover{border-color:var(--azul2)}
.resumen b{color:var(--azul)}
.resumen button[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.resumen button[aria-pressed="true"] b{color:#fff}
.volver.p b{color:#7A4300}

.volver{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.volver button{min-height:48px;border:1px solid var(--borde);background:#fff;border-radius:12px;padding:0 16px;cursor:pointer;font-weight:500;color:var(--azul)}
.volver b{font-size:19px;color:var(--azul)}

/* Instagram: una fila = una cuenta = un toque */
.fila{display:flex;align-items:stretch;background:#fff;border:1px solid var(--borde);border-radius:14px;margin-bottom:8px;overflow:hidden}
.copiar{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.copiar .txt{flex:1;min-width:0}
.copiar .u{display:block;font-size:19px;font-weight:700;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copiar .n{display:block;font-size:14px;color:var(--texto2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copiar .acc{flex:0 0 auto;background:var(--azul);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px}
.fila.ok{border-color:var(--ok);background:var(--okFondo)}
.fila.ok .acc{background:var(--ok)}
.ver{flex:0 0 auto;display:flex;align-items:center;padding:0 14px;border-left:1px solid var(--borde);color:var(--azul2);font-size:14px;font-weight:500;text-decoration:none}
.ver:hover{background:var(--fondo)}

/* Mails: un botón gigante */
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:20px}
.grande{width:100%;min-height:76px;border:0;border-radius:14px;background:var(--azul);color:#fff;font-size:21px;font-weight:700;cursor:pointer}
.grande.fin{background:var(--ok)}
.estado{font-size:16px;margin:14px 0 8px;color:var(--texto)}
.barra{height:10px;border-radius:9px;background:var(--borde);overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento);transition:width .25s}
.tandas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tanda{min-width:84px;min-height:48px;border:1px solid var(--borde);background:#fff;border-radius:10px;cursor:pointer;font-size:15px;color:var(--azul)}
.tanda.ok{background:var(--okFondo);border-color:var(--ok);color:var(--ok);font-weight:700}
.chico{border:0;background:none;color:var(--azul2);text-decoration:underline;cursor:pointer;padding:12px 0 0;font-size:15px}

.vacio,.cargando{text-align:center;color:var(--texto2);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ok);color:#fff;padding:16px 22px;border-radius:14px;font-size:18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#A03434}
footer{font-size:13px;color:var(--texto2);text-align:center;padding:30px 0}

/* Selección de cuentas */
.marca{flex:0 0 60px;border:0;border-right:1px solid var(--borde);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.marca i{width:26px;height:26px;border:2px solid #9FB0BF;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:17px;font-weight:700;background:#fff}
.fila.sel{border-color:var(--acento);box-shadow:0 0 0 2px rgba(41,168,224,.35)}
.fila.sel .marca i{background:var(--acento);border-color:var(--acento)}
.herr{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.herr button{min-height:48px;border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
.herr .sutil{border-color:var(--borde);color:var(--texto2);font-weight:500}
.ayuda{font-size:14px;color:var(--texto2);margin:0 4px 10px}
.pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);box-shadow:0 -6px 20px rgba(25,59,87,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:9}
.pie .wrap{display:flex;gap:10px;align-items:center;padding:0}
.pie .grande{min-height:64px;font-size:19px}
.pie .cuenta{flex:0 0 auto;font-size:15px;color:var(--texto2);text-align:center;line-height:1.2}
.pie .cuenta b{display:block;font-size:22px;color:var(--azul)}
body.con-pie main{padding-bottom:110px}
body.con-pie .toast{bottom:112px}
/* Mails de la tanda */
.tanda.actual{outline:3px solid #E8963A;outline-offset:1px;font-weight:700}
.lista-mails{list-style:none;margin:10px 0 0;padding:0 12px 6px;background:var(--fondo);border:1px solid var(--borde);border-radius:10px;font-size:14px;max-height:300px;overflow-y:auto;scroll-behavior:smooth}
.lista-mails .th{position:sticky;top:0;background:var(--fondo);font-weight:700;color:var(--azul);padding:10px 0 6px;border-bottom:2px solid var(--borde);display:flex;justify-content:space-between;gap:8px;z-index:1}
.lista-mails .th span{font-weight:500;font-size:13px}
.lista-mails .th.ok{color:var(--ok)}
.lista-mails .th.ahora{color:#7A4300}
.lista-mails li.ok .m{color:var(--texto2);text-decoration:line-through}
.lista-mails li.ahora{background:#FFF4E5;margin:0 -12px;padding:6px 12px}
.lista-mails li{padding:6px 0;border-bottom:1px solid var(--borde);min-width:0}
.lista-mails li:last-child{border-bottom:0}
.lista-mails .m{display:block;color:var(--texto);word-break:break-all;font-weight:500}
.lista-mails .q{display:block;color:var(--texto2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:520px){
  .copiar{padding:10px 12px}
  .copiar .u{font-size:17px}
  .copiar .acc{display:none}
  .fila.ok .copiar .acc{display:block;padding:6px 10px;font-size:14px}
  .marca{flex-basis:52px}
  .ver{padding:0 10px;font-size:13px}
}
.lista-tit{font-size:14px;color:var(--texto2);margin:16px 0 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <img src="https://www.mpba.gov.ar/assets/images/logo2021w.png" alt="Ministerio Público de la Provincia de Buenos Aires" onerror="this.remove()">
  <b>Difusión</b>
</div></header>

<main class="wrap">
  <div class="modos" role="group" aria-label="Qué querés copiar">
    <button class="modo" type="button" data-modo="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram</button>
    <button class="modo" type="button" data-modo="mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Mails</button>
  </div>
  <div id="vista"><p class="cargando">Cargando…</p></div>
  <footer>Comunicación Digital · MPBA</footer>
</main>
<div class="pie" id="pie" hidden><div class="wrap"><div class="cuenta"><b id="pieN">0</b>de 20</div><button class="grande" type="button" id="pieCopiar">Copiar seleccionadas</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwX1bq7LFy6tAMuXLh8ikY9o9RT9Ug_WFih8E_zfaZRZi8zlizve8o5NSO6UjkETrA29w/exec';
const POR_TANDA = 15;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9@._]+/g, ' ').trim();
const LS = {
  get(k, d) { try { const v = localStorage.getItem('vista.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vista.' + k, JSON.stringify(v)); } catch (e) {} }
};
const mailsDe = s => String(s || '').toLowerCase().split(/[\s,;/]+/).map(x => x.replace(/^\.+|\.+$/g, '')).filter(x => /^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/.test(x));
const igsDe = s => String(s || '').split(/[\s,;]+/).map(p => { const m = p.match(/instagram\.com\/([A-Za-z0-9._]+)/); return (m ? m[1] : p).replace(/^@/, '').replace(/\/+$/, '').toLowerCase(); }).filter(h => /^[a-z0-9._]{2,30}$/.test(h));

const LIMITE_IG = 20;
const S = { contactos: [], difusiones: [], categorias: [], modo: LS.get('modo', 'ig'), grupo: null, q: '', copiadas: new Set(LS.get('copiadas', [])), sel: [], verTanda: {} };

/* ---------- datos ---------- */
function preparar(c) {
  c._igs = igsDe(c.Instagram); c._mails = mailsDe(c.Mail);
  c._difs = String(c.Difusiones || '').split(',').map(s => s.trim()).filter(Boolean);
  c._busq = norm([c.Nombre, c.Detalle, c.Persona, c['Categoría'], c.Zona, c._igs.join(' ')].join(' '));
  return c;
}
function aplicar(d) {
  S.contactos = (d.contactos || []).map(preparar);
  S.difusiones = (d.difusiones || []).filter(x => x.estado !== 'Archivada').map(x => x.nombre);
  S.categorias = d.categorias || [];
}
async function cargar() {
  const cache = LS.get('cache', null);
  if (cache) { aplicar(cache); render(); }
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'datos' }) });
    const d = await r.json();
    if (!d.ok) throw new Error();
    aplicar(d); LS.set('cache', { contactos: d.contactos, difusiones: d.difusiones, categorias: d.categorias }); render();
  } catch (e) {
    if (!cache) $('#vista').innerHTML = '<p class="vacio">No se pudo cargar. Revisá la conexión y recargá la página.</p>';
  }
}

/* Grupos: primero las difusiones activas, después las categorías. Solo los que tienen algo para copiar. */
function grupos(campo) {
  const out = [];
  S.difusiones.forEach(n => out.push({ id: 'd:' + n, nombre: n, dif: true, lista: S.contactos.filter(c => c._difs.includes(n)) }));
  const cats = S.categorias.concat([...new Set(S.contactos.map(c => c['Categoría']))].filter(k => !S.categorias.includes(k)));
  cats.forEach(n => out.push({ id: 'c:' + n, nombre: n, lista: S.contactos.filter(c => c['Categoría'] === n) }));
  out.push({ id: 'todos', nombre: 'Todos', lista: S.contactos });
  return out.map(g => Object.assign(g, { n: unicos(g.lista, campo).length })).filter(g => g.n);
}
function unicos(lista, campo) { return [...new Set(lista.flatMap(c => c[campo]))]; }
const plural = (n, uno, varios) => n === 1 ? '1 ' + uno : n + ' ' + varios;
/* Orden fijo: el de la pestaña Categorías de la planilla; después, alfabético. */
function idxCat(cat) { const i = S.categorias.indexOf(cat); return i < 0 ? 999 : i; }
function porCategoria(a, b) { return idxCat(a['Categoría']) - idxCat(b['Categoría']) || String(a['Categoría']).localeCompare(b['Categoría'], 'es') || a.Nombre.localeCompare(b.Nombre, 'es'); }
/* Botones de grupos: proyectos (naranja) arriba, categorías (azul) abajo. */
function gridGrupos(campo, uno, varios) {
  const gs = grupos(campo), pr = gs.filter(g => g.dif), ca = gs.filter(g => !g.dif);
  const boton = x => `<button class="grupo${x.dif ? ' dif' : ''}" type="button" data-grupo="${esc(x.id)}"><span class="nom">${esc(x.nombre)}</span><span>${plural(x.n, uno, varios)}</span></button>`;
  return (pr.length ? `<h2 class="sec p"><span class="etq p">Proyectos</span>Congresos, concursos y difusiones</h2><div class="grupos">${pr.map(boton).join('')}</div>` : '')
    + `<h2 class="sec c"><span class="etq c">Categorías</span>Por tipo de contacto</h2><div class="grupos">${ca.map(boton).join('')}</div>`;
}
/* Cabecera de un grupo abierto, con su color y el desglose por categoría. */
function cabecera(g, campo, uno, varios) {
  const cuenta = {};
  g.lista.forEach(c => { const n = c[campo].length; if (n) cuenta[c['Categoría']] = (cuenta[c['Categoría']] || 0) + n; });
  const cats = Object.keys(cuenta).sort((a, b) => idxCat(a) - idxCat(b));
  return `<div class="volver${g.dif ? ' p' : ''}"><button type="button" data-volver>← Volver</button><span><span class="etq ${g.dif ? 'p' : 'c'}">${g.dif ? 'Proyecto' : 'Categoría'}</span><br><b>${esc(g.nombre)}</b></span></div>`
    + (cats.length > 1 ? `<div class="resumen" role="group" aria-label="Filtrar por categoría"><button type="button" data-subcat="" aria-pressed="${!S.subcat}">Todas <b>${Object.values(cuenta).reduce((a, b) => a + b, 0)}</b></button>${cats.map(k => `<button type="button" data-subcat="${esc(k)}" aria-pressed="${S.subcat === k}">${esc(k)} <b>${cuenta[k]}</b></button>`).join('')}</div>` : '');
}

/* ---------- vistas ---------- */
function render() {
  document.querySelectorAll('.modo').forEach(b => b.setAttribute('aria-pressed', b.dataset.modo === S.modo));
  S.modo === 'ig' ? vistaIG() : vistaMails();
  pie();
}

/* Lista de cuentas visible ahora (búsqueda o grupo), en orden, sin repetir. */
function cuentasVisibles() {
  const q = norm(S.q).replace(/^@/, '');
  let lista = [];
  if (q) { const pal = q.split(/\s+/); lista = S.contactos.filter(c => c._igs.length && pal.every(p => c._busq.includes(p))); }
  else if (S.grupo) { const g = grupos('_igs').find(x => x.id === S.grupo); lista = g ? g.lista.filter(c => c._igs.length && (!S.subcat || c['Categoría'] === S.subcat)) : []; }
  const vistos = new Set(), out = [];
  lista.slice().sort(porCategoria).forEach(c => c._igs.forEach(h => { if (!vistos.has(h)) { vistos.add(h); out.push({ h, c }); } }));
  return out;
}

function vistaIG() {
  const g = S.grupo && grupos('_igs').find(x => x.id === S.grupo);
  let html = `<div class="buscar"><input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Escribí un nombre o @usuario" aria-label="Buscar cuenta de Instagram" value="${esc(S.q)}"></div>`;
  const cuentas = cuentasVisibles();
  if (S.q.trim() || g) {
    if (!S.q.trim()) html += cabecera(g, '_igs', 'cuenta', 'cuentas');
    else html += '<div style="height:14px"></div>';
    if (!cuentas.length) html += `<p class="vacio">No hay cuentas con “${esc(S.q)}”.</p>`;
    else {
      const pendientes = cuentas.filter(x => !S.copiadas.has(x.h) && !S.sel.includes(x.h)).length;
      html += `<p class="ayuda">Tocá una cuenta para copiarla sola, o marcá el cuadrado de varias para copiarlas juntas (hasta ${LIMITE_IG}).</p>
        <div class="herr">${pendientes && S.sel.length < LIMITE_IG ? `<button type="button" data-auto>${S.sel.length ? 'Marcar ' + Math.min(LIMITE_IG - S.sel.length, pendientes) + ' más' : 'Marcar las próximas ' + Math.min(LIMITE_IG, pendientes)}</button>` : ''}
        ${S.sel.length ? '<button class="sutil" type="button" data-limpiar>Desmarcar todas</button>' : ''}</div>` + conSubtitulos(cuentas);
    }
  } else {
    html += gridGrupos('_igs', 'cuenta', 'cuentas');
  }
  pintar(html, true);
}

function fila({ h, c }) {
  const ok = S.copiadas.has(h), sel = S.sel.includes(h);
  return `<div class="fila${ok ? ' ok' : ''}${sel ? ' sel' : ''}">
    <button class="marca" type="button" data-marcar="${esc(h)}" aria-pressed="${sel}" aria-label="${sel ? 'Desmarcar' : 'Marcar'} @${esc(h)}"><i>${sel ? '✓' : ''}</i></button>
    <button class="copiar" type="button" data-ig="${esc(h)}" aria-label="Copiar @${esc(h)}">
      <span class="txt"><span class="u">@${esc(h)}</span><span class="n">${esc(c.Nombre)}</span></span><span class="acc">${ok ? '✓ Copiado' : 'Copiar'}</span></button>
    <a class="ver" href="https://www.instagram.com/${esc(h)}/" target="_blank" rel="noopener" aria-label="Ver el perfil de @${esc(h)}">Ver<br>perfil</a></div>`;
}

/* Si la lista mezcla categorías (proyecto, búsqueda, Todos), separa con un subtítulo por categoría. */
function conSubtitulos(cuentas) {
  const cats = [...new Set(cuentas.map(x => x.c['Categoría']))];
  if (cats.length < 2) return cuentas.map(fila).join('');
  const n = {}; cuentas.forEach(x => n[x.c['Categoría']] = (n[x.c['Categoría']] || 0) + 1);
  let html = '', ant = null;
  cuentas.forEach(x => {
    const k = x.c['Categoría'];
    if (k !== ant) { html += `<h3 class="sub">${esc(k)}<span>${plural(n[k], 'cuenta', 'cuentas')}</span></h3>`; ant = k; }
    html += fila(x);
  });
  return html;
}

function pie() {
  const on = S.modo === 'ig' && S.sel.length > 0;
  $('#pie').hidden = !on; document.body.classList.toggle('con-pie', on);
  if (on) { $('#pieN').textContent = S.sel.length; $('#pieCopiar').textContent = 'Copiar ' + plural(S.sel.length, 'marcada', 'marcadas'); }
}

function vistaMails() {
  const g = S.grupo && grupos('_mails').find(x => x.id === S.grupo);
  if (!g) { pintar(gridGrupos('_mails', 'mail', 'mails')); return; }
  // Mails sin repetir, ordenados por categoría (así cada tanda queda agrupada)
  const quien = {};
  g.lista.filter(c => !S.subcat || c['Categoría'] === S.subcat).sort(porCategoria).forEach(c => c._mails.forEach(m => { if (!quien[m]) quien[m] = c; }));
  const mails = Object.keys(quien);
  const total = Math.ceil(mails.length / POR_TANDA);
  const tandas = [...Array(total).keys()].map(i => mails.slice(i * POR_TANDA, (i + 1) * POR_TANDA));
  const cop = new Set(LS.get('mails.' + g.id, []));
  const hecha = i => tandas[i].every(m => cop.has(m));
  const hechas = tandas.filter((_, i) => hecha(i)).length;
  const sig = tandas.findIndex((_, i) => !hecha(i));
  let ver = S.verTanda[g.id];
  if (ver === undefined || ver >= total) ver = sig < 0 ? 0 : sig;
  const rango = i => (i * POR_TANDA + 1) + ' a ' + Math.min((i + 1) * POR_TANDA, mails.length);
  const yaCopiada = hecha(ver);
  const lista = tandas.map((t, i) => {
    const ok = hecha(i), ahora = i === ver;
    return `<li class="th${ok ? ' ok' : ''}${ahora ? ' ahora' : ''}" data-th="${i}">Tanda ${i + 1} · ${rango(i).replace(' a ', '–')}<span>${ok ? '✓ Copiada' : ahora ? '← Esta' : 'Pendiente'}</span></li>`
      + t.map(m => `<li class="${cop.has(m) ? 'ok' : ''}${ahora ? ' ahora' : ''}"><span class="m">${esc(m)}</span><span class="q">${esc(quien[m].Nombre)} · ${esc(quien[m]['Categoría'])}</span></li>`).join('');
  }).join('');
  pintar(cabecera(g, '_mails', 'mail', 'mails') + `
    <div class="tarjeta">
      ${sig < 0 ? `<p class="estado" style="margin-top:0"><b>✓ Ya copiaste los ${mails.length} mails.</b></p>` : ''}
      <button class="grande${yaCopiada ? ' fin' : ''}" type="button" data-copiar-tanda="${ver}">${yaCopiada ? 'Copiar de nuevo ' : 'Copiar mails '}${rango(ver)}</button>
      <p class="estado">Copiaste <b>${hechas} de ${total}</b> tandas de ${POR_TANDA}. Pegalos en CCO.</p>
      <div class="barra"><i style="width:${total ? hechas / total * 100 : 0}%"></i></div>
      <p class="lista-tit">Todos los mails, por tanda. Tachados: ya copiados. En naranja: la tanda del botón.</p>
      <ul class="lista-mails" id="listaMails">${lista}</ul>
      <p class="lista-tit">Elegí otra tanda:</p>
      <div class="tandas">${tandas.map((_, i) => `<button class="tanda${hecha(i) ? ' ok' : ''}${i === ver ? ' actual' : ''}" type="button" data-ver-tanda="${i}" aria-pressed="${i === ver}">${hecha(i) ? '✓ ' : ''}${rango(i).replace(' a ', '–')}</button>`).join('')}</div>
      ${cop.size ? '<button class="chico" type="button" data-reiniciar>Empezar de nuevo</button>' : ''}
    </div>`);
  // La lista deslizable se ubica sola en la tanda del botón
  const box = $('#listaMails'), th = box && box.querySelector(`[data-th="${ver}"]`);
  if (th) box.scrollTop = th.offsetTop - box.offsetTop;
  S._tandas = tandas; S._gid = g.id;
}

function pintar(html, conBusqueda) {
  const enfoque = document.activeElement && document.activeElement.id === 'q';
  const pos = enfoque ? document.activeElement.selectionStart : null;
  $('#vista').innerHTML = html;
  if (conBusqueda && enfoque) { const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); }
}

/* ---------- acciones ---------- */
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    t.remove(); return ok;
  }
}
let tt;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.classList.toggle('err', !!err); t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
function marcarCopiadas(hs) { hs.forEach(h => S.copiadas.add(h)); LS.set('copiadas', [...S.copiadas].slice(-1000)); }

document.querySelector('.modos').addEventListener('click', e => {
  const b = e.target.closest('[data-modo]'); if (!b) return;
  S.modo = b.dataset.modo; S.grupo = null; S.q = ''; S.subcat = ''; LS.set('modo', S.modo); render();
  if (S.modo === 'ig' && matchMedia('(pointer:fine)').matches) $('#q').focus();
});
$('#vista').addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
$('#vista').addEventListener('click', async e => {
  const t = e.target;
  const mk = t.closest('[data-marcar]');
  if (mk) {
    const h = mk.dataset.marcar, i = S.sel.indexOf(h);
    if (i >= 0) S.sel.splice(i, 1);
    else if (S.sel.length >= LIMITE_IG) { toast('Ya marcaste ' + LIMITE_IG + '. Copialas primero.', true); return; }
    else S.sel.push(h);
    render(); return;
  }
  if (t.closest('[data-auto]')) {
    cuentasVisibles().filter(x => !S.copiadas.has(x.h) && !S.sel.includes(x.h)).slice(0, LIMITE_IG - S.sel.length).forEach(x => S.sel.push(x.h));
    render(); return;
  }
  if (t.closest('[data-limpiar]')) { S.sel = []; render(); return; }
  const ig = t.closest('[data-ig]');
  if (ig) {
    const h = ig.dataset.ig;
    if (await copiar('@' + h)) { marcarCopiadas([h]); render(); toast('@' + h + ' copiado'); }
    else toast('No se pudo copiar', true);
    return;
  }
  const gr = t.closest('[data-grupo]');
  if (gr) { S.grupo = gr.dataset.grupo; S.q = ''; S.subcat = ''; render(); window.scrollTo(0, 0); return; }
  if (t.closest('[data-volver]')) { S.grupo = null; S.subcat = ''; render(); return; }
  const sc = t.closest('[data-subcat]');
  if (sc) { S.subcat = sc.dataset.subcat; S.verTanda = {}; render(); return; }
  const vt = t.closest('[data-ver-tanda]');
  if (vt) { S.verTanda[S._gid] = +vt.dataset.verTanda; render(); return; }
  const ct = t.closest('[data-copiar-tanda]');
  if (ct) {
    const i = +ct.dataset.copiarTanda, lote = S._tandas[i];
    if (!(await copiar(lote.join(', ')))) { toast('No se pudo copiar', true); return; }
    const k = 'mails.' + S._gid, cop = new Set(LS.get(k, []));
    lote.forEach(m => cop.add(m));
    LS.set(k, [...cop]);
    const sig = S._tandas.findIndex(t => !t.every(m => cop.has(m)));
    S.verTanda[S._gid] = sig < 0 ? i : sig;
    render(); toast(plural(lote.length, 'mail copiado', 'mails copiados') + ' (' + (i * POR_TANDA + 1) + ' a ' + (i * POR_TANDA + lote.length) + ')');
    return;
  }
  if (t.closest('[data-reiniciar]')) { LS.set('mails.' + S._gid, []); delete S.verTanda[S._gid]; render(); }
});
$('#pieCopiar').addEventListener('click', async () => {
  const lote = S.sel.slice();
  if (!lote.length) return;
  if (!(await copiar(lote.map(h => '@' + h).join(' ')))) { toast('No se pudo copiar', true); return; }
  marcarCopiadas(lote); S.sel = []; render();
  toast(plural(lote.length, 'cuenta copiada', 'cuentas copiadas') + '. Pegalas en el posteo.');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.q) { S.q = ''; render(); } });

render();
cargar();
</script>
</body>
</html>
