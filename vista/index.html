<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Difusión · MPBA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔵</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#193B57;--azul2:#155C8C;--acento:#29A8E0;--texto:#243645;--texto2:#647687;--fondo:#F5F7F9;--borde:#DCE4EB;--ok:#1C8053;--okFondo:#E2F3EA;--font:"Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:17px/1.45 var(--font)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acento);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;border-bottom:4px solid var(--acento)}
header .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
header img{height:30px}
header b{font-size:20px}

/* Dos modos, gigantes */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}
.modo{min-height:72px;border:2px solid var(--borde);background:#fff;border-radius:16px;cursor:pointer;font-size:20px;font-weight:700;color:var(--azul);display:flex;align-items:center;justify-content:center;gap:10px}
.modo svg{width:28px;height:28px}
.modo[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}

.buscar input{width:100%;height:60px;border:2px solid var(--borde);border-radius:14px;background:#fff;padding:0 18px;font-size:19px}
.buscar input:focus{outline:none;border-color:var(--azul2);box-shadow:0 0 0 3px rgba(41,168,224,.3)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}

h2{font-size:15px;color:var(--texto2);font-weight:500;margin:20px 4px 10px}
.grupos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grupos{grid-template-columns:1fr}}
.grupo{min-height:64px;border:1px solid var(--borde);background:#fff;border-radius:14px;cursor:pointer;text-align:left;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--azul)}
.grupo span{font-weight:400;color:var(--texto2);font-size:15px;white-space:nowrap}
.grupo.dif{border-color:var(--acento);background:#EEF8FD}

.volver{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.volver button{min-height:48px;border:1px solid var(--borde);background:#fff;border-radius:12px;padding:0 16px;cursor:pointer;font-weight:500;color:var(--azul)}
.volver b{font-size:19px;color:var(--azul)}

/* Instagram: una fila = una cuenta = un toque */
.fila{display:flex;align-items:stretch;background:#fff;border:1px solid var(--borde);border-radius:14px;margin-bottom:8px;overflow:hidden}
.copiar{flex:1;min-width:0;border:0;background:none;text-align:left;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.copiar .txt{flex:1;min-width:0}
.copiar .u{display:block;font-size:19px;font-weight:700;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copiar .n{display:block;font-size:14px;color:var(--texto2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copiar .acc{flex:0 0 auto;background:var(--azul);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px}
.fila.ok{border-color:var(--ok);background:var(--okFondo)}
.fila.ok .acc{background:var(--ok)}
.ver{flex:0 0 auto;display:flex;align-items:center;padding:0 14px;border-left:1px solid var(--borde);color:var(--azul2);font-size:14px;font-weight:500;text-decoration:none}
.ver:hover{background:var(--fondo)}

/* Mails: un botón gigante */
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:16px;padding:20px}
.grande{width:100%;min-height:76px;border:0;border-radius:14px;background:var(--azul);color:#fff;font-size:21px;font-weight:700;cursor:pointer}
.grande.fin{background:var(--ok)}
.estado{font-size:16px;margin:14px 0 8px;color:var(--texto)}
.barra{height:10px;border-radius:9px;background:var(--borde);overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento);transition:width .25s}
.tandas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tanda{min-width:84px;min-height:48px;border:1px solid var(--borde);background:#fff;border-radius:10px;cursor:pointer;font-size:15px;color:var(--azul)}
.tanda.ok{background:var(--okFondo);border-color:var(--ok);color:var(--ok);font-weight:700}
.chico{border:0;background:none;color:var(--azul2);text-decoration:underline;cursor:pointer;padding:12px 0 0;font-size:15px}

.vacio,.cargando{text-align:center;color:var(--texto2);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ok);color:#fff;padding:16px 22px;border-radius:14px;font-size:18px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#A03434}
footer{font-size:13px;color:var(--texto2);text-align:center;padding:30px 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <img src="https://www.mpba.gov.ar/assets/images/logo2021w.png" alt="Ministerio Público de la Provincia de Buenos Aires" onerror="this.remove()">
  <b>Difusión</b>
</div></header>

<main class="wrap">
  <div class="modos" role="group" aria-label="Qué querés copiar">
    <button class="modo" type="button" data-modo="ig"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Instagram</button>
    <button class="modo" type="button" data-modo="mail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Mails</button>
  </div>
  <div id="vista"><p class="cargando">Cargando…</p></div>
  <footer>Comunicación Digital · MPBA</footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwX1bq7LFy6tAMuXLh8ikY9o9RT9Ug_WFih8E_zfaZRZi8zlizve8o5NSO6UjkETrA29w/exec';
const POR_TANDA = 15;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9@._]+/g, ' ').trim();
const LS = {
  get(k, d) { try { const v = localStorage.getItem('rapido.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rapido.' + k, JSON.stringify(v)); } catch (e) {} }
};
const mailsDe = s => String(s || '').toLowerCase().split(/[\s,;/]+/).map(x => x.replace(/^\.+|\.+$/g, '')).filter(x => /^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/.test(x));
const igsDe = s => String(s || '').split(/[\s,;]+/).map(p => { const m = p.match(/instagram\.com\/([A-Za-z0-9._]+)/); return (m ? m[1] : p).replace(/^@/, '').replace(/\/+$/, '').toLowerCase(); }).filter(h => /^[a-z0-9._]{2,30}$/.test(h));

const S = { contactos: [], difusiones: [], categorias: [], modo: LS.get('modo', 'ig'), grupo: null, q: '', copiadas: new Set(LS.get('copiadas', [])) };

/* ---------- datos ---------- */
function preparar(c) {
  c._igs = igsDe(c.Instagram); c._mails = mailsDe(c.Mail);
  c._difs = String(c.Difusiones || '').split(',').map(s => s.trim()).filter(Boolean);
  c._busq = norm([c.Nombre, c.Detalle, c.Persona, c['Categoría'], c.Zona, c._igs.join(' ')].join(' '));
  return c;
}
function aplicar(d) {
  S.contactos = (d.contactos || []).map(preparar);
  S.difusiones = (d.difusiones || []).filter(x => x.estado !== 'Archivada').map(x => x.nombre);
  S.categorias = d.categorias || [];
}
async function cargar() {
  const cache = LS.get('cache', null);
  if (cache) { aplicar(cache); render(); }
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'datos' }) });
    const d = await r.json();
    if (!d.ok) throw new Error();
    aplicar(d); LS.set('cache', { contactos: d.contactos, difusiones: d.difusiones, categorias: d.categorias }); render();
  } catch (e) {
    if (!cache) $('#vista').innerHTML = '<p class="vacio">No se pudo cargar. Revisá la conexión y recargá la página.</p>';
  }
}

/* Grupos: primero las difusiones activas, después las categorías. Solo los que tienen algo para copiar. */
function grupos(campo) {
  const out = [];
  S.difusiones.forEach(n => out.push({ id: 'd:' + n, nombre: n, dif: true, lista: S.contactos.filter(c => c._difs.includes(n)) }));
  const cats = S.categorias.concat([...new Set(S.contactos.map(c => c['Categoría']))].filter(k => !S.categorias.includes(k)));
  cats.forEach(n => out.push({ id: 'c:' + n, nombre: n, lista: S.contactos.filter(c => c['Categoría'] === n) }));
  out.push({ id: 'todos', nombre: 'Todos', lista: S.contactos });
  return out.map(g => Object.assign(g, { n: unicos(g.lista, campo).length })).filter(g => g.n);
}
function unicos(lista, campo) { return [...new Set(lista.flatMap(c => c[campo]))]; }

/* ---------- vistas ---------- */
function render() {
  document.querySelectorAll('.modo').forEach(b => b.setAttribute('aria-pressed', b.dataset.modo === S.modo));
  S.modo === 'ig' ? vistaIG() : vistaMails();
}

function vistaIG() {
  const g = S.grupo && grupos('_igs').find(x => x.id === S.grupo);
  let html = `<div class="buscar"><input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Escribí un nombre o @usuario" aria-label="Buscar cuenta de Instagram" value="${esc(S.q)}"></div>`;
  const q = norm(S.q).replace(/^@/, '');
  if (q) {
    const pal = q.split(/\s+/);
    const res = S.contactos.filter(c => c._igs.length && pal.every(p => c._busq.includes(p)));
    html += res.length ? '<h2>Tocá la cuenta para copiarla</h2>' + filas(res) : `<p class="vacio">No hay cuentas con “${esc(S.q)}”.</p>`;
  } else if (g) {
    html += `<div class="volver"><button type="button" data-volver>← Volver</button><b>${esc(g.nombre)}</b></div>` + filas(g.lista.filter(c => c._igs.length));
  } else {
    html += '<h2>O elegí un grupo</h2><div class="grupos">' + grupos('_igs').map(x => `<button class="grupo${x.dif ? ' dif' : ''}" type="button" data-grupo="${esc(x.id)}">${esc(x.nombre)}<span>${x.n === 1 ? '1 cuenta' : x.n + ' cuentas'}</span></button>`).join('') + '</div>';
  }
  pintar(html, true);
}

function filas(lista) {
  return lista.slice().sort((a, b) => a.Nombre.localeCompare(b.Nombre, 'es')).flatMap(c => c._igs.map(h => {
    const ok = S.copiadas.has(h);
    return `<div class="fila${ok ? ' ok' : ''}"><button class="copiar" type="button" data-ig="${esc(h)}" aria-label="Copiar @${esc(h)}">
      <span class="txt"><span class="u">@${esc(h)}</span><span class="n">${esc(c.Nombre)}</span></span><span class="acc">${ok ? '✓ Copiado' : 'Copiar'}</span></button>
      <a class="ver" href="https://www.instagram.com/${esc(h)}/" target="_blank" rel="noopener" aria-label="Ver el perfil de @${esc(h)}">Ver perfil</a></div>`;
  })).join('');
}

function vistaMails() {
  const g = S.grupo && grupos('_mails').find(x => x.id === S.grupo);
  if (!g) {
    pintar('<h2>¿A quién le escribís?</h2><div class="grupos">' + grupos('_mails').map(x => `<button class="grupo${x.dif ? ' dif' : ''}" type="button" data-grupo="${esc(x.id)}">${esc(x.nombre)}<span>${x.n === 1 ? '1 mail' : x.n + ' mails'}</span></button>`).join('') + '</div>');
    return;
  }
  const mails = unicos(g.lista, '_mails');
  const total = Math.ceil(mails.length / POR_TANDA);
  const hechas = LS.get('tandas.' + g.id, []);
  const sig = [...Array(total).keys()].find(i => !hechas.includes(i));
  const rango = i => (i * POR_TANDA + 1) + ' a ' + Math.min((i + 1) * POR_TANDA, mails.length);
  pintar(`<div class="volver"><button type="button" data-volver>← Volver</button><b>${esc(g.nombre)}</b></div>
    <div class="tarjeta">
      ${sig === undefined
        ? `<button class="grande fin" type="button" disabled>✓ Copiaste los ${mails.length} mails</button>`
        : `<button class="grande" type="button" data-tanda="${sig}">Copiar mails ${rango(sig)}</button>`}
      <p class="estado">Copiaste <b>${hechas.length} de ${total}</b> tandas de ${POR_TANDA}. Pegalos en CCO.</p>
      <div class="barra"><i style="width:${total ? hechas.length / total * 100 : 0}%"></i></div>
      <div class="tandas">${[...Array(total).keys()].map(i => `<button class="tanda${hechas.includes(i) ? ' ok' : ''}" type="button" data-tanda="${i}" aria-label="Copiar mails ${rango(i)}">${hechas.includes(i) ? '✓ ' : ''}${rango(i).replace(' a ', '–')}</button>`).join('')}</div>
      ${hechas.length ? '<button class="chico" type="button" data-reiniciar>Empezar de nuevo</button>' : ''}
    </div>`);
  S._mails = mails; S._gid = g.id;
}

function pintar(html, conBusqueda) {
  const enfoque = document.activeElement && document.activeElement.id === 'q';
  const pos = enfoque ? document.activeElement.selectionStart : null;
  $('#vista').innerHTML = html;
  if (conBusqueda && enfoque) { const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); }
}

/* ---------- acciones ---------- */
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    t.remove(); return ok;
  }
}
let tt;
function toast(m, err) { const t = $('#toast'); t.textContent = m; t.classList.toggle('err', !!err); t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

document.querySelector('.modos').addEventListener('click', e => {
  const b = e.target.closest('[data-modo]'); if (!b) return;
  S.modo = b.dataset.modo; S.grupo = null; S.q = ''; LS.set('modo', S.modo); render();
  if (S.modo === 'ig' && matchMedia('(pointer:fine)').matches) $('#q').focus();
});
$('#vista').addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
$('#vista').addEventListener('click', async e => {
  const t = e.target;
  const ig = t.closest('[data-ig]');
  if (ig) {
    const h = ig.dataset.ig;
    if (await copiar('@' + h)) { S.copiadas.add(h); LS.set('copiadas', [...S.copiadas].slice(-500)); render(); toast('@' + h + ' copiado'); }
    else toast('No se pudo copiar', true);
    return;
  }
  const gr = t.closest('[data-grupo]');
  if (gr) { S.grupo = gr.dataset.grupo; S.q = ''; render(); window.scrollTo(0, 0); return; }
  if (t.closest('[data-volver]')) { S.grupo = null; render(); return; }
  const td = t.closest('[data-tanda]');
  if (td) {
    const i = +td.dataset.tanda, lote = S._mails.slice(i * POR_TANDA, (i + 1) * POR_TANDA);
    if (!(await copiar(lote.join(', ')))) { toast('No se pudo copiar', true); return; }
    const k = 'tandas.' + S._gid, h = LS.get(k, []);
    if (!h.includes(i)) h.push(i);
    LS.set(k, h); render(); toast(lote.length + ' mails copiados');
    return;
  }
  if (t.closest('[data-reiniciar]')) { LS.set('tandas.' + S._gid, []); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.q) { S.q = ''; render(); } });

render();
cargar();
</script>
</body>
</html>
